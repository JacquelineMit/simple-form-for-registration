<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пользователи</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="users.css" />
    <script src="users.js" defer></script>
  </head>
  <body>
    <main class="auth-card users-card">
      <h1>Пользователи</h1>
      <p>Добавление и редактирование пользователей</p>

      <form id="add-user-form" class="user-form" novalidate>
        <label
          >Ник
          <input name="name" type="text" autocomplete="off" />
        </label>
        <label
          >Почта
          <input name="email" type="email" autocomplete="off" />
        </label>
        <label
          >Пол
          <select name="gender">
            <option value="М">М</option>
            <option value="Ж">Ж</option>
          </select>
        </label>
        <label
          >Номер телефона
          <input name="phone" type="tel" autocomplete="off" />
        </label>
        <button type="submit">Добавить</button>
      </form>

      <div
        class="table-wrapper"
        tabindex="0"
        role="region"
        aria-label="Таблица пользователей"
      >
        <table>
          <thead>
            <tr>
              <th scope="col">Ник</th>
              <th scope="col">Почта</th>
              <th scope="col">Пол</th>
              <th scope="col">Номер телефона</th>
              <th scope="col">Действия</th>
            </tr>
          </thead>
          <tbody id="users-list">
            <tr>
              <td colspan="5" class="empty-state">Пользователей пока нет</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="auth-link"><a href="home.html">На главную</a></p>
    </main>

    <template id="user-row-template">
      <tr>
        <td><input name="name" type="text" aria-label="Ник" readonly /></td>
        <td><input name="email" type="email" aria-label="Почта" readonly /></td>
        <td>
          <select name="gender" aria-label="Пол" disabled>
            <option value="М">М</option>
            <option value="Ж">Ж</option>
          </select>
        </td>
        <td>
          <input name="phone" type="tel" aria-label="Номер телефона" readonly />
        </td>
        <td>
          <div class="row-actions">
            <button type="button" data-action="edit">Редактировать</button>
            <button type="button" data-action="save" hidden>Сохранить</button>
            <button type="button" data-action="cancel" class="secondary" hidden>
              Отмена
            </button>
            <button type="button" data-action="delete" class="secondary">
              Удалить
            </button>
          </div>
        </td>
      </tr>
    </template>
  </body>
</html>
